<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國文複習 - 易誤詞辨析互動網頁</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --accent-color: #e74c3c;
      --success-color: #2ecc71;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1rem;
      opacity: 0.8;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      background-color: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 1rem 2rem;
      border: none;
      background: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: var(--secondary-color);
      border-bottom-color: var(--secondary-color);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 重點整理卡片樣式 */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .word-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 5px solid var(--secondary-color);
    }

    .word-card h3 {
      font-size: 1.2rem;
      color: var(--primary-color);
      margin-bottom: 0.8rem;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 0.4rem;
    }

    .word-item {
      margin-bottom: 0.6rem;
    }

    .word-title {
      font-weight: bold;
      color: var(--secondary-color);
    }

    /* 測驗區樣式 */
    .quiz-header {
      background: var(--card-bg);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .quiz-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: var(--primary-color);
    }

    .options-list {
      list-style: none;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 0.8rem 1rem;
      margin-bottom: 0.6rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not([disabled]) {
      background-color: #f1f5f9;
      border-color: var(--secondary-color);
    }

    .option-btn.correct {
      background-color: #d1fae5;
      border-color: var(--success-color);
      color: #065f46;
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: #fee2e2;
      border-color: var(--accent-color);
      color: #991b1b;
    }

    .explanation-box {
      margin-top: 1rem;
      padding: 1rem;
      background-color: #f0f9ff;
      border-left: 4px solid var(--secondary-color);
      border-radius: 4px;
      display: none;
    }

    .next-btn, .restart-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    .next-btn:hover, .restart-btn:hover {
      opacity: 0.9;
    }

    .score-card {
      text-align: center;
      padding: 2rem;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: none;
    }

    .score-card h2 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    .score-number {
      font-size: 3rem;
      font-weight: bold;
      color: var(--secondary-color);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>國文複習：單元七 易誤詞辨析</h1>
    <p>重點對照與線上互動測驗系統</p>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('notes')">重點整理卡片</button>
    <button class="tab-btn" onclick="switchTab('quiz')">線上互動測驗</button>
  </nav>

  <div class="container">
    <!-- 重點整理區 -->
    <div id="notes" class="tab-content active">
      <div class="word-grid" id="wordGrid"></div>
    </div>

    <!-- 測驗區 -->
    <div id="quiz" class="tab-content">
      <div id="quizContainer">
        <div class="quiz-header">
          <span>題目：<strong id="currentQNum">1</strong> / <span id="totalQNum">14</span></span>
          <span>目前得分：<strong id="currentScore">0</strong> 分</span>
        </div>

        <div class="quiz-card">
          <div class="question-title" id="questionText">題目載入中...</div>
          <div class="options-list" id="optionsContainer"></div>
          <div class="explanation-box" id="explanationBox"></div>
          <button class="next-btn" id="nextBtn" style="display: none;" onclick="nextQuestion()">下一題</button>
        </div>
      </div>

      <div class="score-card" id="scoreCard">
        <h2>測驗完成！</h2>
        <div class="score-number" id="finalScore">0 分</div>
        <p id="scoreComment"></p>
        <button class="restart-btn" onclick="restartQuiz()">重新測驗</button>
      </div>
    </div>
  </div>

  <script>
    // 易誤詞重點資料
    const wordData = [
      { pair: "1. 權力 vs 權利", items: [ { term: "權力", def: "具有控制、指揮等影響的力量。" }, { term: "權利", def: "人民依法法律規定得享有並受法律保護的地位或利益。" } ] },
      { pair: "2. 啟示 vs 啟事", items: [ { term: "啟示", def: "啟發指示，使人有所領悟。" }, { term: "啟事", def: "為了公開聲明某事，而登在報刊或張貼在公告欄上的文字。" } ] },
      { pair: "3. 報復 vs 抱負", items: [ { term: "報復", def: "對傷害自己的人，以類似的手段進行反擊。" }, { term: "抱負", def: "心中有所懷抱。指志向、理想、願望。" } ] },
      { pair: "4. 必須 vs 必需", items: [ { term: "必須", def: "副詞。一定、必定。" }, { term: "必需", def: "動詞/形容詞。不可缺少的。" } ] },
      { pair: "5. 厲害 vs 利害", items: [ { term: "厲害", def: "猛烈、高強；嚴重、劇烈。" }, { term: "利害", def: "利益和損害。" } ] },
      { pair: "6. 儀容 vs 遺容", items: [ { term: "儀容", def: "儀表容貌。" }, { term: "遺容", def: "人死後的容貌或生前的肖像。" } ] },
      { pair: "7. 處事 vs 處世", items: [ { term: "處事", def: "治理事務。" }, { term: "處世", def: "待人接物，應付世情。" } ] },
      { pair: "8. 休養 vs 修養", items: [ { term: "休養", def: "休息調養。" }, { term: "修養", def: "修治涵養；品德、風度。" } ] },
      { pair: "9. 不齒 vs 不恥", items: [ { term: "不齒", def: "羞與為伍，看不起。" }, { term: "不恥", def: "不認為羞恥。" } ] },
      { pair: "10. 反應 vs 反映", items: [ { term: "反應", def: "受到刺激而引起的相應活動。" }, { term: "反映", def: "將客觀事物或實質狀況所引發的主觀感受，如實呈現或傳達。" } ] },
      { pair: "11. 犯難 vs 患難", items: [ { term: "犯難", def: "冒險。" }, { term: "患難", def: "艱難困苦的處境。" } ] },
      { pair: "12. 不力 vs 不利", items: [ { term: "不力", def: "不盡力、未用心力。" }, { term: "不利", def: "不順遂；有壞處、沒有好處。" } ] },
      { pair: "13. 功德 vs 公德", items: [ { term: "功德", def: "功業與德行；行善所生的利益。" }, { term: "公德", def: "履行社會義務、顧及公眾利益應遵循的道德。" } ] },
      { pair: "14. 截止 vs 截至", items: [ { term: "截止", def: "不及物動詞。到某個時期即停止進行。" }, { term: "截至", def: "介詞短語。到某個時候（後需接具體時間）。" } ] }
    ];

    // 題目資料
    const quizData = [
      {
        q: "1. 下列文句「 」中的詞彙，何者使用最為恰當？",
        options: [
          "A) 憲法明確保障了每位國民應有的基本「權力」，任何人不得非法侵害。",
          "B) 新任總理就職後，隨即展開對行政機關內部「權利」的重組與釋出。",
          "C) 司法機關必須嚴格依法行使審判「權力」，以維護社會的公平與正義。",
          "D) 消費者在購買商品時，擁有知情與退換貨的「權力」，受消費者保護法規範。"
        ],
        answer: 2,
        exp: "解析：(C)正確。司法機關行使的是具有支配與強制力的政治/行政「權力」。(A)(D)應為受法律保障的「權利」；(B)行政機關內部應為「權力」。"
      },
      {
        q: "2. 下列選項中「啟示」與「啟事」的使用，何者完全正確？",
        options: [
          "A) 這部經典電影給予現代人深刻的道德「啟事」，引人深思。",
          "B) 董事會今日在各大報刊登了重要的人事更動「啟示」。",
          "C) 社區公布欄上貼有一張尋找遺失皮包的「啟事」，希望能儘速找回。",
          "D) 大自然中的四季更迭，蘊含著許多寶貴的人生「啟事」。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「啟事」為公開聲明之文字（如尋物啟事）。(A)(D)給予思想領悟者應為「啟示」；(B)報刊刊登聲明應為「啟事」。"
      },
      {
        q: "3. 語文運用講求字詞的精確性。下列文句何者表達最為妥貼？",
        options: [
          "A) 青年學者懷抱著滿腔「報復」，矢志為解決氣候變遷問題貢獻所學。",
          "B) 面對對手的惡意中傷，他選擇以法律手段進行合理的「抱負」。",
          "C) 這位創業家從小就樹立了宏大的「抱負」，希望能打造國際級企業。",
          "D) 兩國因邊界爭端爆發軍事衝突，陷入了冤冤相報的「抱負」循環。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「抱負」指志向與理想。(A)應為懷抱「抱負」；(B)(D)反擊傷害行為應為「報復」。"
      },
      {
        q: "4. 下列文句「 」內的詞彙填入，何者完全符合語法與語意規範？",
        options: [
          "A) 想要在學術領域取得突破，研究者「必需」具備嚴謹的邏輯思考能力。",
          "B) 水、空氣與陽光，是維持人類生命運作所「必須」的基本物質。",
          "C) 依照考場規則，考生「必須」於開考前十五分鐘進場準備。",
          "D) 出國旅遊時，個人隨身帶的藥品屬於生活「必須」品。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「必須」為副詞，修飾動詞「進場」。(A)修飾動詞「具備」應用副詞「必須」；(B)(D)修飾名詞表不可或缺應使用形容詞「必需」。"
      },
      {
        q: "5. 下列文句中關於「厲害」與「利害」的辨析，何者使用正確？",
        options: [
          "A) 這場突如其來的暴風雨非常「利害」，導致路樹紛紛倒塌。",
          "B) 在商業談判中，雙方代表均精於計算其中的「厲害」得失。",
          "C) 這位新到任的工程師技術十分「厲害」，迅速解決了系統故障。",
          "D) 兩家公司利益重疊，彼此之間存在著錯綜複雜的「厲害」關係。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「厲害」指本領高強。(A)暴風雨猛烈應為「厲害」；(B)(D)指利益與損害應使用「利害」。"
      },
      {
        q: "6. 下列各句選詞構句，何者語境最適當且無不恰當用語？",
        options: [
          "A) 面試時保持整潔端莊的「遺容」，能給考官留下良好的第一印象。",
          "B) 家屬在告別式上悲慟萬分，依依不捨地瞻仰逝者的「遺容」。",
          "C) 學校規定學生每日清晨須接受「遺容」檢查，確保儀表符合規範。",
          "D) 經過美容師的精修，她的「遺容」煥然一新，展現出高雅的氣質。"
        ],
        answer: 1,
        exp: "解析：(B)正確。「遺容」特指逝者之容貌。(A)(C)(D)對生者容貌儀表應使用「儀容」。"
      },
      {
        q: "7. 下列文句「 」中的詞彙，何者填入後語義最通順且符合慣用法？",
        options: [
          "A) 老張性格沉穩，在公司裡處理複雜事務總是「處世」得宜。",
          "B) 現代社會複雜多變，學習如何圓融「處事」、與人和睦相處是一門學問。",
          "C) 他遵循古聖先賢的哲理，以此作為立身「處世」的基本準則。",
          "D) 專案經理在「處世」業務時，展現了極高的行政效率與決斷力。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「處世」指待人接物、立身於社會。(A)(D)處理具體事務應用「處事」；(B)強調與人適應相處應使用「處世」。"
      },
      {
        q: "8. 下列文句關於「休養」與「修養」的運用，何者完全正確？",
        options: [
          "A) 手術過後，醫師建議病人必須在家靜心「修養」至少一個月。",
          "B) 他說話極具風度且待人謙遜，展現了極高的文化與道德「休養」。",
          "C) 經過這段時間的「休養」生息，該地區的生態環境已逐漸恢復生機。",
          "D) 一個人即使學識淵博，若缺乏品格「休養」，仍難以獲得他人的尊崇。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「休養生息」為固定詞組。(A)調養身體應為「休養」；(B)(D)指品德涵養應使用「修養」。"
      },
      {
        q: "9. 下列文句「 」中的詞語，何者使用完全正確？",
        options: [
          "A) 他為了個人利益不惜出賣朋友，這種卑劣行徑令人「不恥」。",
          "B) 優秀的學習者應具備「不齒」下問的精神，勇於向他人請教。",
          "C) 君子重視內在的德行累積，對於惡衣惡食往往「不齒」。",
          "D) 抄襲他人研究成果屬於嚴重的學術倫理違規，為同儕所「不齒」。"
        ],
        answer: 3,
        exp: "解析：(D)正確。「不齒」指看不起、鄙視。(A)卑劣行徑令人看不起應用「不齒」；(B)不以向地位低者請教為恥應為「不恥下問」；(C)不以貧困為恥應用「不恥」。"
      },
      {
        q: "10. 下列各句中「反應」與「反映」的替換或使用，何者最為精確？",
        options: [
          "A) 這篇調查報告真實地「反映」了基層勞工在經濟轉型期所面臨的困境。",
          "B) 實驗室中的化學物質在加熱後，迅速產生了劇烈的「反映」。",
          "C) 民眾對於政府新推出的稅制改革措施，普遍給予了正面熱烈的「反映」。",
          "D) 藝術家透過畫筆，「反應」出對社會不公現象的深刻批判。"
        ],
        answer: 0,
        exp: "解析：(A)正確。「反映」指如實呈現客觀情況。(B)化學現象應為「反應」；(C)受刺激後的意見回饋應為「反應」；(D)呈現批判應使用「反映」。"
      },
      {
        q: "11. 下列文句「 」中的詞彙，何者使用最適切？",
        options: [
          "A) 唯有在經歷了生死的「犯難」之後，才能真正考驗出兩人友情深淺。",
          "B) 消防隊員在火場中不顧自身安危，挺身「患難」，成功救出受困民眾。",
          "C) 俗話說：「患難」見真情，在面臨逆境時依然陪伴身邊的才是真朋友。",
          "D) 面對極地探險的各種險阻，探險隊員展現了排除「患難」的精神。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「患難」為名詞，指困苦處境。(A)生死困境應為「患難」；(B)冒險不避艱險應為動詞「挺身犯難」；(D)排除困難應為「排難/犯難」。"
      },
      {
        q: "12. 下列文句「 」中的詞彙，何者使用符合語義規範？",
        options: [
          "A) 由於警方防範「不利」，導致該區域治安持續惡化，引發民眾不滿。",
          "B) 當前的國際經濟形勢對出口導向型企業極為「不力」，必須提早因應。",
          "C) 行政機關因推動政策「不力」，遭到監察院提出糾正案。",
          "D) 談判代表在條件「不力」的情況下，依然憑藉智謀爭取到了最大利益。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「不力」指未盡全力，常用於動詞後作補語。(A)防範未盡力應為「不力」；(B)(D)指狀況有壞處、不順遂應使用「不利」。"
      },
      {
        q: "13. 下列文句關於「功德」與「公德」的語境運用，何者正確？",
        options: [
          "A) 在公共場所大聲喧嘩且隨地吐痰，是缺乏「功德」心的具體表現。",
          "B) 許多企業家積極投入慈善賑災活動，這種慷慨解囊的善舉真是「公德」無量。",
          "C) 維護公園環境衛生是全體市民的責任，展現了良好的社會「公德」。",
          "D) 古人設立義堂幫助貧困鄉梓，這項「公德」事業深得後人敬仰。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「公德」指社會公共道德。(A)公共場所規範應為「公德心」；(B)(D)慈善行善利益應為「功德」。"
      },
      {
        q: "14. 下列關於「截止」與「截至」的文句，何者完全符合語法規範？",
        options: [
          "A) 招生委員會宣布，本次研究所考試報名日期「截至」到本週五下午五點。",
          "B) 「截止」目前為止，本季度的產品銷售總額已經超越了去年同期紀錄。",
          "C) 稿件徵選活動已於昨日「截止」，主辦單位現已進入評審與統計階段。",
          "D) 本次徵文比賽「截止」下個月底，請有意參加者抓緊時間投稿。"
        ],
        answer: 2,
        exp: "解析：(C)正確。「截止」為不及物動詞，不直接帶時間賓語。(A)「截至」已包含「到」，不可寫「截至到」；(B)(D)後面有具體時間賓語時應使用「截至」。"
      }
    ];

    // 初始化重點卡片
    function renderNotes() {
      const grid = document.getElementById('wordGrid');
      grid.innerHTML = wordData.map(group => `
        <div class="word-card">
          <h3>${group.pair}</h3>
          ${group.items.map(item => `
            <div class="word-item">
              <span class="word-title">【${item.term}】</span>${item.def}
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    // 測驗變數
    let currentQ = 0;
    let score = 0;
    let answered = false;

    // 載入題目
    function loadQuestion() {
      answered = false;
      const q = quizData[currentQ];
      document.getElementById('currentQNum').innerText = currentQ + 1;
      document.getElementById('questionText').innerText = q.q;
      
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = q.options.map((opt, idx) => `
        <button class="option-btn" onclick="selectOption(${idx})">${opt}</button>
      `).join('');

      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
    }

    // 選擇答案
    function selectOption(idx) {
      if (answered) return;
      answered = true;

      const q = quizData[currentQ];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) {
          btn.classList.add('correct');
        }
        if (i === idx && idx !== q.answer) {
          btn.classList.add('wrong');
        }
      });

      if (idx === q.answer) {
        score += Math.round(100 / quizData.length);
        document.getElementById('currentScore').innerText = score;
      }

      const expBox = document.getElementById('explanationBox');
      expBox.innerText = q.exp;
      expBox.style.display = 'block';

      document.getElementById('nextBtn').style.display = 'block';
    }

    // 下一題
    function nextQuestion() {
      currentQ++;
      if (currentQ < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    // 顯示結果
    function showResults() {
      document.getElementById('quizContainer').style.display = 'none';
      const scoreCard = document.getElementById('scoreCard');
      scoreCard.style.display = 'block';
      document.getElementById('finalScore').innerText = `${score} 分`;

      let comment = "";
      if (score >= 90) comment = "太棒了！您對國文易誤詞的理解非常紮實！";
      else if (score >= 70) comment = "表現良好！再複習一下錯題就能拿滿分囉！";
      else comment = "加油！建議切換到「重點整理卡片」重新強化觀念。";
      
      document.getElementById('scoreComment').innerText = comment;
    }

    // 重來
    function restartQuiz() {
      currentQ = 0;
      score = 0;
      document.getElementById('currentScore').innerText = score;
      document.getElementById('quizContainer').style.display = 'block';
      document.getElementById('scoreCard').style.display = 'none';
      loadQuestion();
    }

    // 分頁切換
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabId === 'notes') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
      }

      document.getElementById(tabId).classList.add('active');
    }

    // 初始化頁面
    window.onload = function() {
      renderNotes();
      document.getElementById('totalQNum').innerText = quizData.length;
      loadQuestion();
    };
  </script>
