<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國文總複習 - 互動學習系統</title>
  <style>
    :root {
      --primary-color: #1e293b;
      --secondary-color: #2563eb;
      --accent-color: #ef4444;
      --success-color: #10b981;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }

    .unit-selector-wrapper {
      margin-top: 10px;
    }

    .unit-select {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: white;
      color: var(--primary-color);
      cursor: pointer;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      background-color: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 1rem 2rem;
      border: none;
      background: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: var(--secondary-color);
      border-bottom-color: var(--secondary-color);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 重點卡片樣式 */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .word-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 5px solid var(--secondary-color);
    }

    .word-card h3 {
      font-size: 1.2rem;
      color: var(--primary-color);
      margin-bottom: 0.8rem;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 0.4rem;
    }

    .word-item {
      margin-bottom: 0.6rem;
    }

    .word-title {
      font-weight: bold;
      color: var(--secondary-color);
    }

    /* 測驗區樣式 */
    .quiz-header {
      background: var(--card-bg);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .quiz-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: var(--primary-color);
    }

    .options-list {
      list-style: none;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 0.8rem 1rem;
      margin-bottom: 0.6rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not([disabled]) {
      background-color: #f1f5f9;
      border-color: var(--secondary-color);
    }

    .option-btn.correct {
      background-color: #d1fae5;
      border-color: var(--success-color);
      color: #065f46;
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: #fee2e2;
      border-color: var(--accent-color);
      color: #991b1b;
    }

    .explanation-box {
      margin-top: 1rem;
      padding: 1rem;
      background-color: #eff6ff;
      border-left: 4px solid var(--secondary-color);
      border-radius: 4px;
      display: none;
    }

    .next-btn, .restart-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    .next-btn:hover, .restart-btn:hover {
      opacity: 0.9;
    }

    .score-card {
      text-align: center;
      padding: 2rem;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: none;
    }

    .score-card h2 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    .score-number {
      font-size: 3rem;
      font-weight: bold;
      color: var(--secondary-color);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>國文總複習：互動學習系統</h1>
    <div class="unit-selector-wrapper">
      <label for="unitSelect" style="margin-right: 8px;">選擇複習單元：</label>
      <select id="unitSelect" class="unit-select" onchange="changeUnit(this.value)">
        <option value="unit1">單元 7-1：易誤詞辨析</option>
        <option value="unit2">單元 7-2：狀聲詞辨析</option>
      </select>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('notes')">重點整理卡片</button>
    <button class="tab-btn" onclick="switchTab('quiz')">線上互動測驗</button>
  </nav>

  <div class="container">
    <!-- 重點整理區 -->
    <div id="notes" class="tab-content active">
      <div class="word-grid" id="wordGrid"></div>
    </div>

    <!-- 測驗區 -->
    <div id="quiz" class="tab-content">
      <div id="quizContainer">
        <div class="quiz-header">
          <span>題目：<strong id="currentQNum">1</strong> / <span id="totalQNum">0</span></span>
          <span>目前得分：<strong id="currentScore">0</strong> 分</span>
        </div>

        <div class="quiz-card">
          <div class="question-title" id="questionText">題目載入中...</div>
          <div class="options-list" id="optionsContainer"></div>
          <div class="explanation-box" id="explanationBox"></div>
          <button class="next-btn" id="nextBtn" style="display: none;" onclick="nextQuestion()">下一題</button>
        </div>
      </div>

      <div class="score-card" id="scoreCard">
        <h2>測驗完成！</h2>
        <div class="score-number" id="finalScore">0 分</div>
        <p id="scoreComment"></p>
        <button class="restart-btn" onclick="restartQuiz()">重新測驗本單元</button>
      </div>
    </div>
  </div>

  <script>
    // 跨單元資料庫
    const unitsData = {
      unit1: {
        title: "單元 7-1：易誤詞辨析",
        notes: [
          { pair: "1. 權力 vs 權利", items: [ { term: "權力", def: "具有控制、指揮等影響的力量。" }, { term: "權利", def: "人民依法法律規定得享有並受法律保護的地位或利益。" } ] },
          { pair: "2. 啟示 vs 啟事", items: [ { term: "啟示", def: "啟發指示，使人有所領悟。" }, { term: "啟事", def: "為了公開聲明某事，登在報刊或張貼在公告欄上的文字。" } ] },
          { pair: "3. 報復 vs 抱負", items: [ { term: "報復", def: "對傷害自己的人，以類似手段進行反擊。" }, { term: "抱負", def: "心中有所懷抱。指志向、理想、願望。" } ] },
          { pair: "4. 必須 vs 必需", items: [ { term: "必須", def: "一定、必定。" }, { term: "必需", def: "不可缺少的。" } ] },
          { pair: "5. 厲害 vs 利害", items: [ { term: "厲害", def: "猛烈、高強；嚴重、劇烈。" }, { term: "利害", def: "利益和損害。" } ] },
          { pair: "6. 儀容 vs 遺容", items: [ { term: "儀容", def: "儀表容貌。" }, { term: "遺容", def: "人死後的容貌或生前的肖像。" } ] },
          { pair: "7. 處事 vs 處世", items: [ { term: "處事", def: "治理事務。" }, { term: "處世", def: "待人接物，應付世情。" } ] },
          { pair: "8. 休養 vs 修養", items: [ { term: "休養", def: "休息調養。" }, { term: "修養", def: "修治涵養使學問道德臻於精美完善；品德、風度。" } ] },
          { pair: "9. 不齒 vs 不恥", items: [ { term: "不齒", def: "羞與為伍，看不起。" }, { term: "不恥", def: "不認為羞恥。" } ] },
          { pair: "10. 反應 vs 反映", items: [ { term: "反應", def: "受刺激引起之活動。" }, { term: "反映", def: "如實呈現客觀狀況或傳達感受。" } ] },
          { pair: "11. 犯難 vs 患難", items: [ { term: "犯難", def: "冒險、不避艱險。" }, { term: "患難", def: "艱難困苦的處境。" } ] },
          { pair: "12. 不力 vs 不利", items: [ { term: "不力", def: "不盡力、未用心力。" }, { term: "不利", def: "不順遂；有壞處、沒有好處。" } ] },
          { pair: "13. 功德 vs 公德", items: [ { term: "功德", def: "功業與德行；行善利益。" }, { term: "公德", def: "履行社會義務應遵循之道德。" } ] },
          { pair: "14. 截止 vs 截至", items: [ { term: "截止", def: "不及物動詞。到某時期即停止。" }, { term: "截至", def: "介詞短語。到某個時候（後接時間）。" } ] }
        ],
        quiz: [
          { q: "1. 下列文句「 」中的詞彙，何者使用最為恰當？", options: ["A) 憲法保障基本「權力」", "B) 行政機關內部「權利」重組", "C) 依法行使審判「權力」", "D) 退換貨的「權力」"], answer: 2, exp: "解析：(C)正確。審判權力屬於支配與強制力。(A)(D)為「權利」；(B)應為「權力」。" },
          { q: "2. 下列選項中「啟示」與「啟事」的使用，何者完全正確？", options: ["A) 電影給予道德「啟事」", "B) 刊登人事更動「啟示」", "C) 張貼尋找皮包的「啟事」", "D) 蘊含人生「啟事」"], answer: 2, exp: "解析：(C)正確。「啟事」為公開聲明告示。(A)(D)應為思想上的「啟示」；(B)應為「啟事」。" },
          { q: "3. 下列文句何者表達最為妥貼？", options: ["A) 懷抱著滿腔「報復」", "B) 法律手段合理「抱負」", "C) 樹立了宏大的「抱負」", "D) 冤冤相報的「抱負」"], answer: 2, exp: "解析：(C)正確。「抱負」指志向理想。(A)應為「抱負」；(B)(D)反擊應為「報復」。" },
          { q: "4. 下列文句「 」內的詞彙，何者完全符合語法規範？", options: ["A) 研究者「必需」具備邏輯", "B) 生存所「必須」的基本物質", "C) 考生「必須」開考前進場", "D) 生活「必須」品"], answer: 2, exp: "解析：(C)正確。「必須」為副詞修飾動詞。(A)修飾動詞應用「必須」；(B)(D)修飾名詞應用「必需」。" },
          { q: "5. 下列文句關於「厲害」與「利害」的辨析，何者正確？", options: ["A) 暴風雨非常「利害」", "B) 精於計算「厲害」得失", "C) 工程師技術十分「厲害」", "D) 錯綜複雜的「厲害」關係"], answer: 2, exp: "解析：(C)正確。「厲害」指本領高強。(A)暴風雨應為「厲害」；(B)(D)利益損害應為「利害」。" }
        ]
      },
      unit2: {
        title: "單元 7-2：狀聲詞辨析",
        notes: [
          { pair: "一、自然與物品聲", items: [
            { term: "風聲", def: "蕭蕭、蕭颯、呼呼、瑟瑟" },
            { term: "雨聲", def: "瀟瀟（風雨聲）、淅淅、淅淅瀝瀝" },
            { term: "水聲", def: "潺潺、淙淙、泠泠、淙淙、濺濺" },
            { term: "鳥鳴聲", def: "啾啾、啁啾、嚶嚶、關關、間關、嘎嘎、啞啞、咕咕（鴿子）、呢喃（燕子）" },
            { term: "蟲鳴/器物", def: "唧唧（蟲鳴）、鏗鏘/鋃鐺（金屬）、丁丁（伐木）、霍霍（磨刀）、札札（機杼）" }
          ] },
          { pair: "二、與人有關的聲音", items: [
            { term: "笑聲/哭聲", def: "笑聲：呵呵、嗤嗤、格格、噗哧；哭聲：呱呱、哇哇、嗚嗚咽咽" },
            { term: "讀書與說話", def: "「琅琅」上口（讀書）、「牙牙」學語（幼兒）、「喃喃」細語（低語）、嘰嘰喳喳（吵雜細碎）" },
            { term: "情感與生理", def: "「嘖嘖」稱奇（讚美）、「嗷嗷」待哺（哀號）、飢腸「轆轆」（空腹鳴叫）、「咄咄」自語（感嘆/驚怪）" }
          ] }
        ],
        quiz: [
          { q: "1. 《木蘭詩》中「小弟聞姊來，磨刀霍霍向豬羊」，句中的「霍霍」是用來描寫何種聲音？", options: ["A) 伐木的聲音", "B) 磨刀急速的聲音", "C) 織布機運轉的聲音", "D) 金屬碰撞的聲音"], answer: 1, exp: "解析：(B)正確。「霍霍」形容磨刀急速聲；伐木聲為「丁丁」，機杼織布聲為「札札」。" },
          { q: "2. 「風雨瀟瀟，雞鳴膠膠」，文中的「瀟瀟」主要用來描寫何種現象？", options: ["A) 風雨急暴或風雨聲", "B) 溪水湍急流動聲", "C) 人聲吵雜細碎", "D) 樹葉掉落聲"], answer: 0, exp: "解析：(A)正確。「瀟瀟」常用來形容風雨急暴聲；流水聲多用「潺潺」或「淙淙」。" },
          { q: "3. 下列文句「 」中的狀聲詞，何者使用最適當？", options: ["A) 教室裡傳來同學們「啾啾」的讀書聲", "B) 織布房裡傳來「札札」的機杼聲", "C) 小溪「蕭蕭」地流過山谷", "D) 樹上的鳥兒「丁丁」地歡唱"], answer: 1, exp: "解析：(B)正確。「札札」為機杼織布聲。(A)讀書聲應為「琅琅」；(C)流水聲應為「潺潺」；(D)鳥鳴聲應為「啾啾」。" },
          { q: "4. 下列何者是用來描寫「腹中空腹鳴叫」的狀聲詞？", options: ["A) 喃喃", "B) 轆轆", "C) 嗷嗷", "D) 啞啞"], answer: 1, exp: "解析：(B)正確。「飢腸轆轆」描寫肚子飢餓時的鳴叫聲；「喃喃」為低語；「嗷嗷」為哀號聲。" },
          { q: "5. 下列各組狀聲詞與其對應的聲音，何者「不正確」？", options: ["A) 伐木聲——丁丁", "B) 蟲鳴聲——唧唧", "C) 燕子叫聲——咕咕", "D) 讚美聲——嘖嘖"], answer: 2, exp: "解析：(C)不正確。「咕咕」多形容鴿子叫聲；燕子叫聲常用「呢喃」。" }
        ]
      }
    };

    let currentUnitKey = 'unit1';
    let currentQ = 0;
    let score = 0;
    let answered = false;

    // 渲染重點卡片
    function renderNotes() {
      const grid = document.getElementById('wordGrid');
      const unit = unitsData[currentUnitKey];
      grid.innerHTML = unit.notes.map(group => `
        <div class="word-card">
          <h3>${group.pair}</h3>
          ${group.items.map(item => `
            <div class="word-item">
              <span class="word-title">【${item.term}】</span>${item.def}
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    // 載入題目
    function loadQuestion() {
      answered = false;
      const quizList = unitsData[currentUnitKey].quiz;
      const q = quizList[currentQ];
      
      document.getElementById('currentQNum').innerText = currentQ + 1;
      document.getElementById('totalQNum').innerText = quizList.length;
      document.getElementById('questionText').innerText = q.q;
      
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = q.options.map((opt, idx) => `
        <button class="option-btn" onclick="selectOption(${idx})">${opt}</button>
      `).join('');

      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
    }

    // 選擇答案
    function selectOption(idx) {
      if (answered) return;
      answered = true;

      const quizList = unitsData[currentUnitKey].quiz;
      const q = quizList[currentQ];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) {
          btn.classList.add('correct');
        }
        if (i === idx && idx !== q.answer) {
          btn.classList.add('wrong');
        }
      });

      if (idx === q.answer) {
        score += Math.round(100 / quizList.length);
        document.getElementById('currentScore').innerText = score;
      }

      const expBox = document.getElementById('explanationBox');
      expBox.innerText = q.exp;
      expBox.style.display = 'block';

      document.getElementById('nextBtn').style.display = 'block';
    }

    // 下一題
    function nextQuestion() {
      currentQ++;
      const quizList = unitsData[currentUnitKey].quiz;
      if (currentQ < quizList.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    // 顯示結果
    function showResults() {
      document.getElementById('quizContainer').style.display = 'none';
      const scoreCard = document.getElementById('scoreCard');
      scoreCard.style.display = 'block';
      document.getElementById('finalScore').innerText = `${score} 分`;

      let comment = "";
      if (score >= 90) comment = "太厲害了！您對這個單元的觀念掌握得非常完美！";
      else if (score >= 70) comment = "表現優秀！再對照卡片複習一下錯題就能拿到滿分！";
      else comment = "加油！建議切換到「重點整理卡片」重新強化一下記憶喔！";
      
      document.getElementById('scoreComment').innerText = comment;
    }

    // 重來
    function restartQuiz() {
      currentQ = 0;
      score = 0;
      document.getElementById('currentScore').innerText = score;
      document.getElementById('quizContainer').style.display = 'block';
      document.getElementById('scoreCard').style.display = 'none';
      loadQuestion();
    }

    // 切換單元
    function changeUnit(unitKey) {
      currentUnitKey = unitKey;
      renderNotes();
      restartQuiz();
    }

    // 切換頁籤 (重點 / 測驗)
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabId === 'notes') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
      }

      document.getElementById(tabId).classList.add('active');
    }

    // 初始化
